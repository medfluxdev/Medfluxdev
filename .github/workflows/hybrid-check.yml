name: Hybrid Scanned-Contract Check

on:
  push:
    branches:
      - main
      - JAMAL
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hybrid-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-targeted:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: medflux
          POSTGRES_PASSWORD: medflux_ci
          POSTGRES_DB: medflux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medflux -d medflux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      AUTH_ENABLED: "false"
      # Tests laufen bewusst unauthentifiziert; Auth-fail-closed verlangt dafuer
      # den expliziten lokalen/'test'-Opt-in (Security Phase-1, P0-1).
      MEDFLUX_INSECURE_DEV: "true"
      DATABASE_URL: postgresql+psycopg://medflux:medflux_ci@127.0.0.1:5432/medflux
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Run hybrid scanned-contract tests
        run: pytest -q tests/test_hybrid_scanned_pipeline.py tests/test_hybrid_vision_runtime.py
      - name: Run harness and document-intelligence tests
        run: pytest -q tests/test_harness_v3.py tests/test_document_intelligence.py
      - name: Run document-processing integration tests
        run: pytest -q tests/test_document_processing.py tests/test_document_import.py
      - name: Run security posture regression tests
        run: pytest -q tests/test_runtime_security_posture.py tests/test_security_runtime_config.py tests/test_auth_security.py
      - name: Run full backend regression suite
        run: pytest -q

  frontend-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify