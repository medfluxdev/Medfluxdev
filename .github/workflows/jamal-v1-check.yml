name: JAMAL v1 Check

on:
  push:
    branches:
      - JAMAL-v1
  workflow_dispatch:

concurrency:
  group: jamal-v1-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-targeted:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AUTH_ENABLED: "false"
      MEDFLUX_UNIT_ONLY: "1"
      PYTHONPATH: .
    defaults:
      run:
        working-directory: JAMAL v1/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: JAMAL v1/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Run hybrid scanned-contract tests
        run: pytest -q tests/test_hybrid_scanned_pipeline.py tests/test_hybrid_vision_runtime.py
      - name: Run harness and document-intelligence tests
        run: pytest -q tests/test_harness_v3.py tests/test_document_intelligence.py

  frontend-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JAMAL v1/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: JAMAL v1/frontend/package-lock.json
      - run: npm ci
      - run: npm run verify
