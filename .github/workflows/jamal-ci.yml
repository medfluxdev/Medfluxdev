name: JAMAL CI

on:
  push:
    branches: [JAMAL]
  pull_request:
    branches: [JAMAL]
  workflow_dispatch:

concurrency:
  group: jamal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: medflux
          POSTGRES_PASSWORD: medflux
          POSTGRES_DB: medflux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medflux -d medflux_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      AUTH_ENABLED: "false"
      AUTH_COOKIE_SECURE: "false"
      APP_SECRET_KEY: ci-only-not-for-production
      DATABASE_URL: postgresql+psycopg://medflux:medflux@127.0.0.1:5432/medflux_test
      OCR_ENABLED: "false"
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      AI_DISCOVERY_TIMEOUT_SECONDS: "0.2"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Python compile gate
        run: python -m compileall -q app tests

      - name: Alembic migration gate
        run: alembic upgrade head

      - name: Full backend regression
        run: python -m pytest -q

  frontend:
    name: Frontend type/test/lint/build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
