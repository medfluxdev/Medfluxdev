name: Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: medflux
          POSTGRES_USER: medflux
          POSTGRES_PASSWORD: medflux_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medflux -d medflux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://medflux:medflux_ci@127.0.0.1:5432/medflux
      APP_ENV: test
      AUTH_ENABLED: "false"
      # Tests laufen bewusst unauthentifiziert; Auth-fail-closed verlangt dafuer
      # den expliziten lokalen/'test'-Opt-in (Security Phase-1, P0-1).
      MEDFLUX_INSECURE_DEV: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: pip install -r requirements.txt
      - name: Security posture regression tests
        run: pytest -q tests/test_runtime_security_posture.py tests/test_security_runtime_config.py
      - name: Migration smoke test
        run: alembic upgrade head
      - name: Backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config >/dev/null
      - name: Build backend image
        run: docker build -t medflux-backend:release ./backend
      - name: Build frontend image
        run: docker build -t medflux-frontend:release ./frontend
