services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: medflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medflux-local}
      POSTGRES_DB: medflux
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medflux -d medflux"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=postgresql+psycopg://medflux:${POSTGRES_PASSWORD:-medflux-local}@postgres:5432/medflux
      - CONTRACTS_DIR=/data/contracts
      - BACKUPS_DIR=/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

  # Lokale KI-Runtime (optional – kann auch nativ installiert sein)
  # ollama:
  #   image: ollama/ollama
  #   ports:
  #     - "11434:11434"
